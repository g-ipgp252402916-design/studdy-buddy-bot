<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Buddy Bot 📚</title>
  <style>
    /* ── Reset & Base ───────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f0f4ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* ── Header ─────────────────────────────────────── */
    header {
      width: 100%;
      max-width: 640px;
      background: #4f46e5;
      color: #fff;
      border-radius: 16px 16px 0 0;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .avatar {
      width: 44px; height: 44px;
      background: #fff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; }
    header p  { font-size: 0.78rem; opacity: 0.85; }

    /* ── Chat window ────────────────────────────────── */
    #chat-window {
      width: 100%;
      max-width: 640px;
      background: #fff;
      flex: 1;
      min-height: 420px;
      max-height: 58vh;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-left: 1px solid #e5e7eb;
      border-right: 1px solid #e5e7eb;
    }

    /* ── Message bubbles ────────────────────────────── */
    .msg { display: flex; gap: 8px; align-items: flex-end; max-width: 90%; }
    .msg.bot  { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.88rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.bot  .bubble { background: #f0f4ff; color: #1e1b4b; border-bottom-left-radius: 4px; }
    .msg.user .bubble { background: #4f46e5; color: #fff;    border-bottom-right-radius: 4px; }

    .msg-icon {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .msg.bot  .msg-icon { background: #ede9fe; }
    .msg.user .msg-icon { background: #c7d2fe; }

    /* typing indicator */
    .typing .bubble { background: #f0f4ff; padding: 12px 16px; }
    .typing-dots { display: flex; gap: 4px; }
    .typing-dots span {
      width: 7px; height: 7px; background: #818cf8;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    /* ── Quick-reply chips ─────────────────────────── */
    #chips {
      width: 100%;
      max-width: 640px;
      background: #fff;
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-left: 1px solid #e5e7eb;
      border-right: 1px solid #e5e7eb;
    }
    .chip {
      background: #ede9fe;
      color: #4f46e5;
      border: none;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .chip:hover { background: #ddd6fe; }

    /* ── Input bar ─────────────────────────────────── */
    #input-bar {
      width: 100%;
      max-width: 640px;
      background: #fff;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      border-radius: 0 0 16px 16px;
      border: 1px solid #e5e7eb;
      border-top: none;
    }
    #user-input {
      flex: 1;
      border: 1.5px solid #c7d2fe;
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #user-input:focus { border-color: #4f46e5; }
    #send-btn {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 42px; height: 42px;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    #send-btn:hover { background: #4338ca; }

    /* ── Scrollbar ─────────────────────────────────── */
    #chat-window::-webkit-scrollbar { width: 5px; }
    #chat-window::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 4px; }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="avatar">📚</div>
  <div>
    <h1>Study Buddy Bot</h1>
    <p>Your friendly study helper · Always here to support you</p>
  </div>
</header>

<!-- Chat window -->
<div id="chat-window"></div>

<!-- Quick-reply chips -->
<div id="chips">
  <button class="chip" onclick="sendChip('Study tips')">📚 Study tips</button>
  <button class="chip" onclick="sendChip('Memory techniques')">🧠 Memory</button>
  <button class="chip" onclick="sendChip('Study breaks')">⏱️ Breaks</button>
  <button class="chip" onclick="sendChip('Avoid distractions')">📵 Distractions</button>
  <button class="chip" onclick="sendChip('Make a study plan')">📅 Study plan</button>
  <button class="chip" onclick="sendChip('Note-taking tips')">✏️ Notes</button>
  <button class="chip" onclick="sendChip('Revision strategies')">📖 Revision</button>
  <button class="chip" onclick="sendChip('I need motivation to study')">💪 Motivation</button>
  <button class="chip" onclick="sendChip('Help')">❓ Help</button>
</div>

<!-- Input bar -->
<div id="input-bar">
  <input id="user-input" type="text" placeholder="Ask me anything about studying…" autocomplete="off" />
  <button id="send-btn" title="Send">➤</button>
</div>

<script>
// ──────────────────────────────────────────────────────────────────────────
// INTENT ENGINE  (mirrors bot_engine.py — no external calls needed)
// ──────────────────────────────────────────────────────────────────────────
const INTENTS = [
  {
    keywords: [/\bhello\b/,/\bhi\b/,/\bhey\b/,/\bgood morning\b/,/\bgood afternoon\b/,/\bgood evening\b/,/\bsup\b/],
    responses: [
      "Hey there! 👋 I'm Study Buddy Bot. I'm here to help you build great study habits. What would you like to know today?",
      "Hello! 😊 Welcome to Study Buddy Bot! Ask me anything about study tips, time management, memory tricks, and more.",
    ]
  },
  {
    // general_study_tips
    keywords: [
      /\bstudy tips?\b/,                // "study tip" / "study tips"
      /\beffective study/,               // "effective study techniques"
      /\bstudy technique/,               // "study techniques"
      /\btips.*study/,                   // "tips on how to study"
      /\bhelp me study\b/,               // "help me study"
      /\bhow do i study\b/,
      /\bwhat are.*study/,               // "what are some study tips"
    ],
    responses: [
      "Here are some practical study tips! 📚\n\n  🎯  Set clear study goals before each session\n  🏡  Choose a quiet, tidy space with no distractions\n  🔁  Use active recall — test yourself instead of just re-reading\n  📅  Review your lessons regularly, not just before exams\n  ✏️  Take concise notes and rewrite them in your own words\n\nConsistent daily effort beats last-minute cramming every time! 💪",
    ]
  },
  {
    // improve_study_habits
    keywords: [
      /\bimprove.*study habit/,          // "improve my study habits"
      /\bstudy better\b/,                // "how can I study better"
      /\bhow to study better\b/,
      /\bimprove.*studying\b/,           // "improve my studying"
      /\bbetter student\b/,
      /\blearn better\b/,
      /\blearn faster\b/,
      /\bbuild.*study/,                  // "build a study routine"
      /\bstudy routine\b/,
      /\bstudy habit\b/,
    ],
    responses: [
      "Building strong study habits takes consistency — here's how! 📈\n\n  🗓️  Follow a daily study routine at the same time each day\n  🎯  Set small, realistic goals (e.g. 'finish one chapter today')\n  ✅  Track your daily progress in a journal or app\n  🔄  Review what you studied the day before at the start of each session\n  🏆  Reward yourself for hitting weekly milestones\n\nSmall consistent steps build lasting habits. You've got this! 😊",
    ]
  },
  {
    // memory_techniques
    keywords: [
      /\bremember\b/,
      /\bmemorize\b/,
      /\bmemory\b/,                      // "improve my memory", "memory techniques"
      /\bforget\b/,
      /\bretain\b/,
      /\brecall\b/,
      /\bflashcard\b/,
      /\bmind map\b/,
      /\bspaced repetition\b/,
      /\bactive recall\b/,
    ],
    responses: [
      "Great question! 🧠 Here are some proven memory techniques:\n\n  🃏  Flashcards — write a question on one side, the answer on the other, and test yourself\n  🔁  Active recall — close your notes and try to recall the key points from memory\n  ⏳  Spaced repetition — review material after 1 day, 3 days, then 1 week\n  🗺️  Mind maps — draw visual diagrams to connect related ideas\n  ✍️  Teach it — explain what you've learned to someone else (or even to yourself)\n\nWhich technique would you like to try first?",
    ]
  },
  {
    // breaks
    keywords: [
      /\bbreaks?\b/,            // "break" or "breaks"
      /\bpomodoro\b/,
      /\brest\b/,
      /\bhow long.*study\b/,
      /\bstudy.*hour\b/,
      /\btired\b/,
      /\bburnout\b/,
      /\bexhausted\b/,
    ],
    responses: [
      "Taking breaks is super important! ⏱️\nTry the Pomodoro Technique:\n  ✅  Study for 25 minutes\n  ✅  Rest for 5 minutes\n  ✅  After 4 rounds, take a longer 15–30 min break\n\nAdjust the timing to suit your needs. Your brain needs rest to absorb information! 💡",
    ]
  },
  {
    // distractions
    keywords: [/\bdistract/,/\bphone\b/,/\bsocial media\b/,/\bfocus\b/,/\bconcentrat/,/\bnotification\b/,/\bnoisy\b/,/\bquiet\b/,/\benvironment\b/],
    responses: [
      "Staying focused is a skill you can practise! 🎯 Here are some tips:\n  📵  Put your phone face-down or in another room\n  🔕  Turn off unnecessary notifications\n  🏡  Study in a quiet, tidy space\n  🎯  Set ONE small goal for each study session\n  🎧  Try lo-fi or white-noise music if silence is too hard\n\nSmall changes make a big difference!",
    ]
  },
  {
    keywords: [/\bstudy plan\b/,/\btimetable\b/,/\bschedule\b/,/\bplan.*study\b/,/\borganize\b/,/\borganise\b/,/\btime manag\b/,/\bplan.*time\b/],
    responses: [
      "A good study plan keeps you on track! 📅 Here's how to make one:\n  1️⃣  List all your subjects\n  2️⃣  Find out your exam or assignment dates\n  3️⃣  Decide how many hours per week you can study\n  4️⃣  Spread subjects evenly across the week\n  5️⃣  Include breaks and fun time too!\n\nWould you like a simple weekly timetable template? Just ask! 📋",
    ]
  },
  {
    keywords: [/\btemplate\b/,/\bexample timetable\b/,/\bsample.*schedule\b/,/\bgive.*timetable\b/,/\bshow.*timetable\b/],
    responses: [
      "Here's a simple weekly template you can adapt! 🗓️\n\nMon: Maths (1 hr) | English (30 min)\nTue: Science (1 hr) | Review Mon notes (20 min)\nWed: History (1 hr) | Flashcard revision (20 min)\nThu: Maths (1 hr) | Free reading (30 min)\nFri: Full review of the week (1 hr)\nSat: Light revision + Rest\nSun: Rest & recharge 🔋\n\nConsistency beats cramming! 💪",
    ]
  },
  {
    // notes
    keywords: [
      /\bnotes?\b/,             // "note" or "notes"
      /\bnote.?tak/,            // "note-taking", "notetaking"
      /\bbetter notes?\b/,      // "take better notes"
      /\bwrite down\b/,
      /\bjot\b/,
      /\bsummariz/,
      /\bhighlight\b/,
      /\bcornell\b/,
    ],
    responses: [
      "Taking great notes helps you remember more! ✏️ Try these methods:\n  📝  Cornell Notes – divide your page into notes, cues, and summary\n  🗒️  Bullet points – keep it short and clear\n  🖊️  Highlight key ideas, not everything\n  🔄  Rewrite your notes in your own words after class\n\nThe act of rewriting is powerful — it helps your brain store the information!",
    ]
  },
  {
    // revision
    keywords: [
      /\brevise\b/,
      /\brevision\b/,
      /\bexam prep\b/,
      /\bprepare.*exam/,        // "prepare for my exams"
      /\bexam.*prep/,           // "exam preparation"
      /\bprepare.*test\b/,
      /\btest prep\b/,
      /\bpractice question\b/,
      /\bpast paper\b/,
      /\bquiz\b/,
    ],
    responses: [
      "Smart revision makes a huge difference! 📖 Here's how to revise effectively:\n  🔁  Use spaced repetition – review after 1 day, 3 days, 1 week\n  📝  Do practice questions and past papers\n  🤔  Test yourself without looking at your notes first\n  👥  Study with a friend and quiz each other\n\nDon't just re-read — actively test your knowledge!",
    ]
  },
  {
    // motivation
    keywords: [
      /\bmotivat/,                       // "motivate", "motivated", "motivation"
      /\bno motivation\b/,               // "I have no motivation"
      /\bneed motivation\b/,             // "I need motivation to study"
      /\bstay motivated\b/,              // "how can I stay motivated"
      /\blazy\b/,                        // "I'm feeling lazy"
      /\bdon't feel like stud/,          // "I don't feel like studying"
      /\bnot in the mood.*stud/,         // "I'm not in the mood to study"
      /\bfeel like giving up\b/,         // "I feel like giving up"
      /\bgive up\b/,
      /\bconfidence\b/,
      /\bstress\b/,
      /\banxious\b/,
      /\bworried\b/,
      /\bcan'?t do\b/,
      /\btoo hard\b/,
      /\bstruggl/,
    ],
    responses: [
      "Hey, don't be too hard on yourself! 💜\n\nYou don't have to finish everything at once. Start with one small task and study for just 10 minutes — once you begin, it usually gets easier!\n\nEvery small step counts! Here are some motivation boosters:\n  🎯  Set one tiny goal for today (e.g. 'read 2 pages')\n  🏆  Reward yourself after completing each goal\n  👫  Study with a friend for accountability\n  📊  Track your achievements — seeing progress keeps you going\n  📌  Remind yourself WHY you started studying\n\nTake a short break when you need one, and remember: you've got this! 🌟",
    ]
  },
  {
    keywords: [/\bsleep\b/,/\binsomnia\b/,/\bstay up late\b/,/\ball.?night\b/],
    responses: [
      "Sleep is a secret study weapon! 😴 Your brain consolidates memories while you sleep.\n\n  ✅  Aim for 8–10 hours of sleep each night\n  ✅  Avoid screens 30 minutes before bed\n  ✅  Try to go to bed at the same time each night\n\nPulling all-nighters actually makes your memory WORSE. Rest is part of studying! 🧠",
    ]
  },
  {
    keywords: [/\bdo my homework\b/,/\bwrite my essay\b/,/\bcomplete.*assignment\b/,/\bsolve.*exam\b/,/\bdo.*test\b/],
    responses: [
      "I'm afraid I can't do that for you. 🚫\n\nMy role is to help you learn HOW to study, not to do the work for you.\nHere's what I CAN do:\n  ✅  Give you study strategies and tips\n  ✅  Help you create a study plan\n  ✅  Teach you memory and revision techniques\n\nWhat study skill would you like to work on? 📚",
    ]
  },
  {
    keywords: [/\bhelp\b/,/\bwhat can you do\b/,/\bwhat do you do\b/,/\boptions\b/,/\bmenu\b/,/\btopic\b/],
    responses: [
      "Here's what I can help you with! 📋\n\n  📚  Study tips & habits\n  🧠  Memory techniques\n  ⏱️  Study breaks & Pomodoro\n  📵  Avoiding distractions\n  📅  Making a study plan or timetable\n  ✏️  Note-taking methods\n  📖  Revision strategies\n  💪  Motivation & dealing with stress\n  😴  Sleep & rest advice\n\nJust type anything related to studying and I'll guide you! 😊",
    ]
  },
  {
    keywords: [/\bbye\b/,/\bgoodbye\b/,/\bsee you\b/,/\bthanks\b/,/\bthank you\b/,/\bthx\b/,/\bcheers\b/],
    responses: [
      "You're welcome! Good luck with your studies! 🌟 Come back any time you need help.",
      "Bye! Keep studying smart, not just hard. 💡 You've got this! 👋",
    ]
  },
];

const FALLBACK = [
  "Hmm, I'm not sure I understand that. 🤔 I'm designed to help with study tips!\n\nTry asking me about:\n  📚  Study habits\n  🧠  Memory techniques\n  📅  Study planning\n\nOr just type help to see everything I can do!",
  "I didn't quite catch that. 😅 I'm a study-focused bot, so let's keep things academic!\nType help to see what I can assist you with.",
];

function getResponse(input) {
  const text = input.toLowerCase().trim();
  for (const intent of INTENTS) {
    for (const kw of intent.keywords) {
      if (kw.test(text)) {
        const r = intent.responses;
        return r[Math.floor(Math.random() * r.length)];
      }
    }
  }
  return FALLBACK[Math.floor(Math.random() * FALLBACK.length)];
}

// ──────────────────────────────────────────────────────────────────────────
// UI helpers
// ──────────────────────────────────────────────────────────────────────────
const chatWindow = document.getElementById('chat-window');
const userInput  = document.getElementById('user-input');

function scrollBottom() {
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

function appendMessage(text, role) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  const icon = document.createElement('div');
  icon.className = 'msg-icon';
  icon.textContent = role === 'bot' ? '📚' : '🧑';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  wrap.appendChild(icon);
  wrap.appendChild(bubble);
  chatWindow.appendChild(wrap);
  scrollBottom();
}

function showTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot typing';
  wrap.id = 'typing-indicator';

  const icon = document.createElement('div');
  icon.className = 'msg-icon';
  icon.textContent = '📚';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

  wrap.appendChild(icon);
  wrap.appendChild(bubble);
  chatWindow.appendChild(wrap);
  scrollBottom();
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function sendMessage(text) {
  const msg = (text || userInput.value).trim();
  if (!msg) return;
  userInput.value = '';
  appendMessage(msg, 'user');
  showTyping();
  setTimeout(() => {
    removeTyping();
    appendMessage(getResponse(msg), 'bot');
  }, 600 + Math.random() * 400);
}

function sendChip(text) { sendMessage(text); }

// ── Intent self-test (run in browser console: runIntentTests()) ────────────
function _getIntentName(input) {
  const text = input.toLowerCase().trim();
  for (const intent of INTENTS) {
    for (const kw of intent.keywords) {
      if (kw.test(text)) return intent.name || '(unnamed)';
    }
  }
  return null; // fallback
}

function runIntentTests() {
  const required = [
    // general_study_tips
    ["give me some study tips",                              "general_study_tips"],
    ["What are some effective study techniques?",            "general_study_tips"],
    // improve_study_habits
    ["How can I study better?",                              "improve_study_habits"],
    ["How can I improve my study habits?",                   "improve_study_habits"],
    // memory_techniques
    ["How can I remember what I learn?",                     "memory_techniques"],
    ["How can I improve my memory?",                         "memory_techniques"],
    // existing intents
    ["Should I take breaks while studying?",                 "breaks"],
    ["How can I avoid distractions when studying?",          "distractions"],
    ["Can you help me make a study timetable?",              "study_plan"],
    ["How can I take better notes?",                         "notes"],
    ["How should I prepare for my exams?",                   "revision"],
    // motivation
    ["I need motivation to study.",                          "motivation"],
    ["I don't feel like studying.",                          "motivation"],
    ["I'm feeling lazy today.",                              "motivation"],
    ["How can I stay motivated to study?",                   "motivation"],
    ["I feel like giving up on my studies.",                 "motivation"],
    ["Motivation",                                           "motivation"],
  ];
  let passed = 0;
  console.group("Study Buddy Bot — Intent Tests");
  required.forEach(([text, expected]) => {
    const got = _getIntentName(text);
    const ok = got === expected;
    if (ok) passed++;
    console[ok ? 'log' : 'error'](
      `[${ok ? 'PASS ✅' : 'FAIL ❌'}] "${text}"\n  expected: ${expected}  got: ${got}`
    );
  });
  console.log(`\n${passed}/${required.length} tests passed.`);
  console.groupEnd();
}

// Add name field to each intent so _getIntentName works correctly
const INTENT_NAMES = [
  "greeting","general_study_tips","improve_study_habits","memory_techniques",
  "breaks","distractions","study_plan","timetable_template","notes","revision",
  "motivation","sleep","homework_refusal","help","goodbye"
];
INTENTS.forEach((intent, i) => { intent.name = INTENT_NAMES[i]; });

document.getElementById('send-btn').addEventListener('click', () => sendMessage());
userInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

// Welcome message on load
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    appendMessage(
      "Hey! 👋 I'm Study Buddy Bot — your friendly academic support bot!\n\nI can help you with study tips, memory techniques, time management, avoiding distractions, and more.\n\nWhat would you like to improve today? You can tap a button below or just type your question! 😊",
      'bot'
    );
  }, 300);
});
</script>
</body>
</html>
